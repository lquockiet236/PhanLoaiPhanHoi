{% extends "base.html" %}
{% block title %}Đăng nhập · Campus Voice{% endblock %}
{% block content %}
<main class="auth-wrap">
    <section class="auth-panel">
        <div class="eyebrow">Campus Voice · Kết nối nhà trường</div>
        <h1>Đăng nhập</h1>
        <!-- <p>Đăng nhập để gửi ý kiến, theo dõi tiến độ và trao đổi với bộ phận phụ trách.</p> -->
        <form method="post">
            <label class="field">Email<input type="email" name="email" value="{{ remembered_email or '' }}"
                    autocomplete="email" required></label>
            <label class="field">Mật khẩu<input type="password" name="password" autocomplete="current-password"
                    required></label>
            <div class="auth-options">
                <label class="remember-me"><input type="checkbox" name="remember_me" {% if remembered_email %}checked{%
                        endif %}> Nhớ mật khẩu</label>
                <button class="button auth-action-button" type="submit">Đăng nhập</button>
            </div>
        </form>
        <div class="auth-foot"> <a href="{{ url_for('register') }}">Chưa có tài khoản?</a></div>
    </section>
</main>
{% endblock %}
